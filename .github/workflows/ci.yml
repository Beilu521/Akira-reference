name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      # -race 在 CI(Linux)上跑竞态检测:watch 模式的 goroutine/channel 代码必须过这一关
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # 打 tag(v1.0.0 之类)自动构建三平台产物并发布 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build (windows / linux / darwin)
        run: |
          VERSION=${GITHUB_REF_NAME}
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=$VERSION" -o dist/akira-windows-amd64.exe ./cmd/akira
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-X main.version=$VERSION" -o dist/akira-linux-amd64 ./cmd/akira
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-X main.version=$VERSION" -o dist/akira-darwin-arm64 ./cmd/akira
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # 模糊测试:随机"模式×日志行"轰炸匹配器,验证分类优化语义等价
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Fuzz matcher (30s)
        run: go test -fuzz=FuzzMatcherEquivalence -fuzztime=30s ./internal/detector/

  # fuzz 冒烟:每个不变量目标轰 10 秒 —— 种子语料+回归语料全量回放,足够拦截退化;
  # 长时轰炸留给本地(README 有命令),CI 不吃 10 分钟
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Fuzz smoke (10s × 9 targets)
        run: |
          go test ./internal/detector/  -fuzz FuzzMatcherEquivalence    -fuzztime 10s
          go test ./internal/watcher/   -fuzz FuzzSplitLines            -fuzztime 10s
          go test ./internal/knowledge/ -fuzz FuzzTokenizeInvariants    -fuzztime 10s
          go test ./internal/knowledge/ -fuzz FuzzCosineRange           -fuzztime 10s
          go test ./internal/knowledge/ -fuzz FuzzRankInvariants        -fuzztime 10s
          go test ./internal/storage/   -fuzz FuzzBlobDecode            -fuzztime 10s
          go test ./internal/alert/     -fuzz FuzzDedupInvariants       -fuzztime 10s
          go test ./internal/alert/     -fuzz FuzzAggregatorCloseSafety -fuzztime 10s
          go test ./internal/stats/     -fuzz FuzzTrackerTotals         -fuzztime 10s
